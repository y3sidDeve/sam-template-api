AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  simu-app

  Sample SAM Template for simu-app

# More info about Globals: https://github.com/awslabs/serverless-application-model/blob/master/docs/globals.rst
Globals:
  Function:
    Timeout: 3

    # You can add LoggingConfig parameters such as the Logformat, Log Group, and SystemLogLevel or ApplicationLogLevel. Learn more here https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/sam-resource-function.html#sam-function-loggingconfig.
    LoggingConfig:
      LogFormat: JSON
Resources:

  TransactionFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: simu_app/
      Handler: infrastructure.api.create_transaction.lambda_handler
      Runtime: python3.12
      Architectures:
      - x86_64
      Events:
        NewEndpoint:
          Type: Api
          Properties:
            Path: /new-transaction
            Method: POST

  CreateUserFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: simu_app/
      Handler: infrastructure.api.create_user.lambda_handler
      Runtime: python3.12
      Architectures:
      - x86_64
      Events:
        CreateUser:
          Type: Api
          Properties:
            Path: /users
            Method: POST

  GetUserFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: simu_app/
      Handler: infrastructure.api.get_user.lambda_handler
      Runtime: python3.12
      Architectures:
      - x86_64
      Events:
        GetUser:
          Type: Api
          Properties:
            Path: /users/{userId}
            Method: GET

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Users
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
      ProvisionedThroughput:
        ReadCapacityUnits: 5
        WriteCapacityUnits: 5
  

  

Outputs:
  # ServerlessRestApi is an implicit API created out of Events key under Serverless::Function
  # Find out more about other implicit resources you can reference within SAM
  # https://github.com/awslabs/serverless-application-model/blob/master/docs/internals/generated_resources.rst#api

  TransactionApi:
    Description: API Gateway endpoint URL for Prod stage for Transaction function
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/new-transaction/"
  TransactionFunction:
    Description: Transaction Lambda Function ARN
    Value: !GetAtt TransactionFunction.Arn
  TransactionFunctionIamRole:
    Description: Implicit IAM Role created for Transaction function
    Value: !GetAtt TransactionFunctionRole.Arn
